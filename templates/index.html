{% extends "base.html" %}
{% block content %}
<div class="main-container">
    <div class="media-tabs-bar">
        <button class="media-tab active" data-tab="book"   onclick="switchTab('book')">📚 Books</button>
        <button class="media-tab"        data-tab="movie"  onclick="switchTab('movie')">🎬 Movies</button>
        <button class="media-tab"        data-tab="series" onclick="switchTab('series')">📺 Series</button>
        <button class="media-tab"        data-tab="anime"  onclick="switchTab('anime')">🌸 Anime</button>
    </div>

    <h2 id="form-main-header">Add a New Book</h2>
    <div class="add-book-form">
        <input type="text" id="book-title" placeholder="Book Title" required>
        <input type="text" id="book-author" placeholder="Author Name">
        <button id="add-btn" onclick="addBook()">Add to Library</button>
    </div>

    <hr>

    <h2>My Collection (click to open)</h2>

    <div class="search-filter-bar" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; width: 100%;">
        <input type="text" id="search-input" placeholder="🔍 Search by title, author, director or studio..." oninput="filterCollection()" style="flex: 1; min-width: 200px; padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem;">

        <select id="status-filter" onchange="filterCollection()" style="padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; background: white; cursor: pointer; min-width: 160px;">
            <option value="all">All Statuses</option>
            <option value="In plan">In plan</option>
            <option value="Active">Reading / Watching</option>
            <option value="Finished">Finished</option>
        </select>
    </div>

    <div id="alert-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; width: 90%; max-width: 400px;"></div>

    <div id="book-list" class="book-grid"></div>
</div>

<div id="book-modal" class="modal" style="display:none; z-index: 1000;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-body">
            </div>
    </div>
</div>

<div id="confirm-modal" class="modal" style="display:none; z-index: 2000; background: rgba(0,0,0,0.6); align-items: center; justify-content: center;">
    <div class="modal-content" style="max-width: 350px; text-align: center; background: #3d3d4e; color: white; padding: 20px; border-radius: 12px;">
        <p id="confirm-text" style="font-size: 1.1rem; margin-bottom: 20px;">Are you sure you want to delete this book?</p>
        <div class="confirm-btn-container" style="display: flex; justify-content: center; gap: 15px;">
            <button onclick="closeConfirm()" class="btn-cancel" style="background: #575766; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer;">Cancel</button>
            <button id="confirm-ok-btn" class="btn-ok" style="background: #00d2d3; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">OK</button>
        </div>
    </div>
</div>

<style>
    .media-tabs-bar {
        display: flex;
        gap: 6px;
        padding: 12px 16px 0;
        border-bottom: 2px solid #e0e0e0;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .media-tab {
        padding: 8px 20px;
        border: none;
        border-radius: 8px 8px 0 0;
        background: #f0f0f0;
        color: #555;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
    }

    .media-tab:hover {
        background: #e0e0e0;
        color: #222;
    }

    .media-tab.active {
        background: #fff;
        color: #4e46e5;
        border-color: #4e46e5;
    }

    .alert-box {
        animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
        from { transform: translateY(-50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
    }
</style>
{% endblock %}
