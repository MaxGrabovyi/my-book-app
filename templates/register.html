{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Create Secure Account</h2>

        <div id="alert-container"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" name="username" minlength="3" required placeholder="User1234">
            </div>

            <div class="form-group">
                <label for="reg-email">Google Email</label>
                <input type="email" id="reg-email" name="email" placeholder="example@gmail.com" required>
                <small class="input-hint">Must be a valid @gmail.com address</small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-input">
                    <input type="password" name="password" id="mainPass"
                           placeholder="Min 8 chars, 1 digit, 1 caps, 1 lower" required>
                    <button type="button" class="toggle-pass" onclick="toggleVisibility('mainPass')">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPass" required>
            </div>

            <button type="submit" class="submit-btn">Register & Protect</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/api/auth/login">Sign In</a></p>
    </div>
</div>

<!-- 🔐 Модальне вікно для введення коду верифікації -->
<div id="verification-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-family: sans-serif;">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">✉️</div>
        <h3 style="margin-top: 0; font-size: 1.4rem; color: #2c3e50;">Email Verification</h3>
        <p style="color: #7f8c8d; font-size: 0.9rem; line-height: 1.4; margin-bottom: 20px;">
            We have simulated sending a 6-digit code to your Gmail. <br>
            <span style="color: #e74c3c; font-weight: bold;">Check your terminal console to copy it!</span>
        </p>

        <input type="text" id="verification-input" placeholder="000000" maxlength="6"
               style="width: 80%; padding: 12px; font-size: 1.5rem; text-align: center; border-radius: 8px; border: 2px solid #ddd; letter-spacing: 6px; margin-bottom: 15px; outline: none; font-weight: bold; color: #2c3e50;">

        <div id="verify-error" style="color: #ff7675; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: bold;"></div>
        <div id="verify-success" style="color: #2ecc71; font-size: 0.95rem; font-weight: bold; margin-bottom: 15px; display: none;"></div>

        <div style="display: flex; gap: 10px; justify-content: center;">
            <button type="button" onclick="closeVerificationModal()" style="background: #bdc3c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cancel</button>
            <button type="button" onclick="submitVerificationCode()" style="background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Verify</button>
        </div>
    </div>
</div>

<script>
    function toggleVisibility(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }

    function openVerificationModal() {
        document.getElementById('verification-modal').style.display = 'flex';
        document.getElementById('verification-input').value = '';
        document.getElementById('verify-error').style.display = 'none';
        document.getElementById('verify-success').style.display = 'none';
    }

    function closeVerificationModal() {
        document.getElementById('verification-modal').style.display = 'none';
    }

    // 🔥 Функція обробки кнопки Verify (тепер вона точно тут і доступна браузеру)
    async function submitVerificationCode() {
        const codeInput = document.getElementById('verification-input').value.trim();
        const errorDiv = document.getElementById('verify-error');
        const successDiv = document.getElementById('verify-success');

        errorDiv.style.display = 'none';

        if (codeInput.length !== 6) {
            errorDiv.textContent = "Code must be exactly 6 digits.";
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/auth/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code: codeInput })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                // Виводимо англійське сповіщення про правильний код
                successDiv.textContent = result.message; // Передає "Correct verification code! Welcome." з Flask
                successDiv.style.display = 'block';

                // Чекаємо 1.5 секунди, щоб користувач встиг прочитати, і робимо редірект
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                errorDiv.textContent = result.message || "Invalid code.";
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            console.error("Verification error:", err);
            errorDiv.textContent = "Network error. Failed to verify.";
            errorDiv.style.display = 'block';
        }
    }

    // Обробка форми реєстрації
    document.getElementById('registerForm').onsubmit = async function (e) {
        e.preventDefault();

        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const password = document.getElementById('mainPass').value;
        const confirm = document.getElementById('confirmPass').value;

        if (password !== confirm) {
            showAlert("Passwords do not match!");
            return;
        }

        if (!email.endsWith('@gmail.com')) {
            showAlert("Only @gmail.com addresses are allowed!");
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    confirm_password: confirm
                })
            });

            const data = await response.json();

            if (response.ok && data.success && data.action === 'requires_verification') {
                openVerificationModal();
            } else if (response.ok && data.success) {
                window.location.href = '/';
            } else {
                showAlert(data.message || "Registration failed");
            }
        } catch (error) {
            console.error("Error:", error);
            showAlert("Connection error. Please try again later.");
        }
    };

    function showAlert(text) {
        const container = document.getElementById('alert-container');
        container.innerHTML = `<div class="alert-box" style="background:#ff7675; color:white; padding:12px; border-radius:8px; margin-bottom:15px; text-align:center; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        ${text}
    </div>`;

        setTimeout(() => {
            container.innerHTML = '';
        }, 5000);
    }
</script>
{% endblock %}
